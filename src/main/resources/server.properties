# Server Configuration
# Any key here can be overridden at startup with `-Dkey=value` (system
# properties win over file values — see ServerConfig).

# ---- Common ---------------------------------------------------------------
server.address=localhost
server.port=8080
server.backlog=1024
server.type=nio
# server.type ∈ { nio, threaded, virtual }

# ---- Threaded transport ---------------------------------------------------
threaded.server.pool.size=100

# ---- NIO transport --------------------------------------------------------
nio.num.io.reactors=1
nio.num.reader.threads=2
nio.num.writer.threads=2

# Wrap the MessageProcessor so handler invocations move off the dispatcher.
# Removes the dispatcher bottleneck described in docs/BENCHMARK.md E3 / H3.
#   nio.async.dispatch.executor : virtual | fixed:<N>   (e.g. fixed:200)
nio.async.dispatch.enabled=false
nio.async.dispatch.executor=fixed:500

# Connection registrar = the worker pool that registers accepted sockets with an
# IOReactor and (when ssl.enabled) runs the SSL handshake. Bounded so a burst of
# slow/malicious handshakes cannot exhaust threads — excess connections are
# rejected and closed. pool.size caps concurrent in-flight handshakes.
nio.registrar.pool.size=64
nio.registrar.queue.capacity=256
# Watchdog deadline for one SSL handshake; the channel is closed if exceeded
# (defends against slowloris-style stalled handshakes).
nio.ssl.handshake.timeout.ms=10000

# ---- SSL (applies to whichever transport is active) -----------------------
ssl.enabled=false
ssl.keystore.path=./src/main/resources/server.jks
ssl.keystore.password=storepass
ssl.key.password=keypass
ssl.truststore.path=./src/main/resources/trustedCerts.jks
ssl.truststore.password=storepass
